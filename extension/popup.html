<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 12px;
        background: #202124;
        color: #e8eaed;
        margin: 0;
      }
      h4 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #9aa0a6;
        margin: 10px 0 4px;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        background: #303134;
        color: #e8eaed;
        border: 1px solid #5f6368;
        border-radius: 6px;
        padding: 6px;
        font-size: 13px;
      }
      button {
        width: 100%;
        background: #8ab4f8;
        color: #202124;
        border: none;
        padding: 8px;
        border-radius: 6px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 8px;
        font-size: 13px;
      }
      button.secondary {
        background: #303134;
        color: #e8eaed;
      }
      .status {
        margin-top: 8px;
        font-size: 12px;
        color: #9aa0a6;
        min-height: 14px;
        overflow-wrap: anywhere;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h4>Flow × Rosterly</h4>

    <label for="backend">Rosterly backend URL</label>
    <input id="backend" placeholder="http://127.0.0.1:8022" />

    <label for="channel">Default channel</label>
    <select id="channel"></select>

    <div class="row">
      <input type="checkbox" id="autoDock" checked />
      <span>Show the dock automatically on labs.google</span>
    </div>

    <button id="save">Save settings</button>
    <button id="inject" class="secondary">Inject / show dock on this tab</button>
    <div class="status" id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
